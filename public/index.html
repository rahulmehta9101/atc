    <style>
        :root {
            --ink: #10263b;
            --hd: #10263b;
            --steel: #51677c;
            --mist: #eef3f7;
            --line: #d5dee6;
            --amber: #f0a30a;
            --bg: #fff;
            --card: #fff;
            --tx: #1b2a38;
            --er: #b3261e;
            --r: 10px;
            --sh: 0 12px 32px -16px rgba(16, 38, 59, .45);
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --hd: #fff;
                --steel: #9fb2c4;
                --mist: #112334;
                --line: #27405a;
                --bg: #0b1a28;
                --card: #12263a;
                --tx: #dfe8f0;
                --er: #ff8f84;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --hd: #fff;
            --steel: #9fb2c4;
            --mist: #112334;
            --line: #27405a;
            --bg: #0b1a28;
            --card: #12263a;
            --tx: #dfe8f0;
            --er: #ff8f84;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 400 17px/1.6 Barlow, system-ui, sans-serif
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            background: var(--ink);
            z-index: 60
        }

        h1,
        h2,
        h3 {
            font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
            color: var(--hd);
            line-height: 1.1;
            margin: 0 0 .5em
        }

        h1 {
            font-size: clamp(2.4rem, 6vw, 4.2rem)
        }

        h2 {
            font-size: clamp(1.8rem, 3.6vw, 2.6rem)
        }

        h3 {
            font-size: 1.4rem
        }

        img {
            max-width: 100%;
            display: block;
            width: 100%;
            height: auto
        }

        a {
            color: inherit
        }

        :focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 2px
        }

        .w {
            max-width: 1160px;
            margin: auto;
            padding: 0 20px
        }

        .nr {
            max-width: 760px
        }

        .sec {
            padding: 72px 0
        }

        .alt {
            background: var(--mist)
        }

        .em {
            padding: 30px;
            text-align: center;
            color: var(--steel);
            grid-column: 1/-1
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 50;
            background: var(--ink);
            color: #fff;
            transition: box-shadow .3s
        }

        header.s {
            box-shadow: 0 8px 24px -10px rgba(0, 0, 0, .6)
        }

        .nv {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            transition: height .3s
        }

        header.s .nv {
            height: 56px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font: 700 1.5rem "Barlow Condensed", sans-serif;
            text-decoration: none
        }

        .logo i {
            width: 36px;
            height: 36px;
            background: var(--amber);
            color: var(--ink);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-style: normal
        }

        .logo img {
            height: 38px;
            width: auto
        }

        #nav {
            display: flex;
            gap: 4px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center
        }

        #nav li {
            position: relative;
            display: flex;
            align-items: center
        }

        #nav>li>a {
            padding: 10px 12px;
            text-decoration: none;
            position: relative;
            font-weight: 500
        }

        #nav>li>a::after {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 4px;
            height: 2px;
            background: var(--amber);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .3s
        }

        #nav>li>a:hover::after,
        #nav>li>a.on::after {
            transform: scaleX(1)
        }

        #nav>li:last-child>a {
            background: var(--amber);
            color: var(--ink);
            border-radius: 8px;
            margin-left: 8px;
            transition: transform .2s
        }

        #nav>li:last-child>a::after {
            display: none
        }

        #nav>li:last-child>a:hover {
            transform: translateY(-2px)
        }

        .cv {
            background: 0;
            border: 0;
            color: inherit;
            cursor: pointer;
            padding: 8px 6px 8px 0;
            margin-left: -6px;
            display: grid
        }

        .cv svg {
            transition: transform .25s
        }

        .dd.open .cv svg {
            transform: rotate(180deg)
        }

        .sub {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 1;
            min-width: 230px;
            list-style: none;
            margin: 0;
            padding: 8px;
            background: var(--card);
            color: var(--tx);
            border-radius: var(--r);
            box-shadow: var(--sh);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s
        }

        .sub a {
            display: block;
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: background .2s, padding .2s
        }

        .sub a:hover,
        .sub a.on {
            background: var(--mist);
            padding-left: 20px
        }

        .sub a.on {
            font-weight: 600
        }

        .dd.open>.sub,
        .dd:has(:focus-visible)>.sub {
            opacity: 1;
            visibility: visible
        }

        @media(hover:hover) {
            .dd:hover>.sub {
                opacity: 1;
                visibility: visible
            }
        }

        #nav a.on {
            color: var(--amber)
        }

        #nav>li:last-child>a.on {
            color: var(--ink)
        }

        .sub a.on {
            color: var(--hd)
        }

        .bg {
            display: none;
            width: 44px;
            height: 44px;
            background: 0;
            border: 0;
            cursor: pointer;
            position: relative
        }

        .bg i,
        .bg i::before,
        .bg i::after {
            position: absolute;
            width: 22px;
            height: 2px;
            background: #fff;
            transition: .3s;
            content: ""
        }

        .bg i {
            top: 21px;
            left: 11px
        }

        .bg i::before {
            top: -7px;
            left: 0
        }

        .bg i::after {
            top: 7px;
            left: 0
        }

        header.m .bg i {
            background: transparent
        }

        header.m .bg i::before {
            top: 0;
            transform: rotate(45deg)
        }

        header.m .bg i::after {
            top: 0;
            transform: rotate(-45deg)
        }

        @media(max-width:900px) {
            .bg {
                display: block
            }

            #nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                background: var(--ink);
                padding: 8px 20px 24px;
                max-height: calc(100vh - 70px);
                overflow: auto
            }

            header.m #nav {
                display: flex
            }

            #nav li {
                flex-wrap: wrap
            }

            #nav>li>a {
                flex: 1;
                padding: 14px 4px
            }

            #nav>li:last-child>a {
                margin: 10px 0 0;
                text-align: center
            }

            .cv {
                padding: 14px
            }

            .sub {
                position: static;
                display: none;
                width: 100%;
                opacity: 1;
                visibility: visible;
                transform: none;
                background: rgba(255, 255, 255, .06);
                color: #fff;
                box-shadow: none
            }

            .dd.open>.sub {
                display: block
            }

            .sub a.on {
                color: var(--amber)
            }

            .sub a:hover,
            .sub a.on {
                background: transparent
            }
        }

        main.pt {
            animation: pt .4s ease
        }

        @keyframes pt {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }

        .rv {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .6s, transform .6s
        }

        .rv.in {
            opacity: 1;
            transform: none
        }

        .hero {
            background: var(--ink);
            color: #fff;
            padding: 84px 0;
            overflow: hidden
        }

        .hero h1 {
            color: #fff
        }

        .hero p {
            color: #c9d6e2;
            max-width: 520px;
            font-size: 1.15rem
        }

        .two {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 56px;
            align-items: center
        }

        @media(max-width:860px) {
            .two {
                grid-template-columns: 1fr;
                gap: 40px
            }
        }

        .fr {
            position: relative
        }

        .fr::before {
            content: "";
            position: absolute;
            inset: 16px -16px -16px 16px;
            border: 2px solid var(--amber);
            border-radius: var(--r)
        }

        .fr img {
            position: relative;
            border-radius: var(--r)
        }

        .btn {
            display: inline-block;
            background: var(--amber);
            color: #10263b;
            font: 600 1rem Barlow, sans-serif;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            border: 2px solid var(--amber);
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            margin: 4px 8px 4px 0
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px -8px rgba(240, 163, 10, .8)
        }

        .btn.o {
            background: transparent;
            color: #fff;
            border-color: rgba(255, 255, 255, .5)
        }

        .btn.s {
            padding: 8px 16px;
            font-size: .95rem
        }

        .btn.l {
            background: transparent;
            color: var(--hd);
            border-color: var(--line)
        }

        .ph {
            background: var(--ink);
            color: #fff;
            padding: 52px 0 56px
        }

        .ph h1 {
            color: #fff;
            font-size: clamp(2.2rem, 5vw, 3.4rem)
        }

        .ph p {
            color: #c9d6e2;
            max-width: 620px;
            margin: 0
        }

        .bc {
            font-size: .92rem;
            color: #9fb2c4;
            margin-bottom: 14px
        }

        .bc a {
            text-decoration: none
        }

        .bc a:hover {
            color: var(--amber)
        }

        .bc span {
            color: #fff
        }

        .g {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))
        }

        .cd {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            overflow: hidden;
            transition: transform .3s, box-shadow .3s, opacity .6s
        }

        .cd:hover {
            transform: translateY(-4px);
            box-shadow: var(--sh)
        }

        .cd .b {
            padding: 22px
        }

        .cd p {
            margin: .3em 0 1em
        }

        .cd small,
        .mt {
            color: var(--steel);
            font-size: .9rem
        }

        .mt b {
            color: var(--hd);
            margin-right: 8px
        }

        .ic {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: #c27f00;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 10px
        }

        a.ia {
            display: block;
            overflow: hidden
        }

        a.ia img {
            transition: transform .5s
        }

        .cd:hover a.ia img {
            transform: scale(1.05)
        }

        .tile {
            position: relative;
            overflow: hidden;
            border-radius: var(--r)
        }

        .tile img {
            transition: transform .6s
        }

        .tile:hover img {
            transform: scale(1.07)
        }

        .tile span {
            position: absolute;
            inset: auto 0 0;
            padding: 28px 16px 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .78));
            color: #fff;
            font-weight: 500
        }

        .tl {
            border-left: 3px solid var(--amber);
            padding-left: 24px;
            display: grid;
            gap: 22px
        }

        .tl h3 {
            margin: 0
        }

        ol.st {
            list-style: none;
            counter-reset: s;
            padding: 0;
            display: grid;
            gap: 14px
        }

        ol.st li {
            counter-increment: s;
            padding-left: 54px;
            position: relative
        }

        ol.st li::before {
            content: counter(s);
            position: absolute;
            left: 0;
            top: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--amber);
            color: var(--ink);
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .vid {
            aspect-ratio: 16/9;
            position: relative;
            border-radius: var(--r);
            overflow: hidden;
            background: var(--ink);
            display: grid;
            place-items: center;
            color: #fff;
            text-align: center
        }

        .vid iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0
        }

        .vid svg {
            width: 64px;
            height: 64px;
            fill: var(--amber);
            transition: transform .3s
        }

        .vid:hover svg {
            transform: scale(1.12)
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin-bottom: 28px
        }

        .ch {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            border: 1.5px solid var(--line);
            background: var(--card);
            color: var(--tx);
            border-radius: 99px;
            padding: 6px 16px;
            font: 500 .95rem Barlow, sans-serif;
            cursor: pointer;
            transition: .2s
        }

        .chip:hover {
            border-color: var(--amber)
        }

        .chip.on {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff
        }

        input,
        textarea {
            font: inherit;
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--tx)
        }

        #q {
            max-width: 300px
        }

        input[aria-invalid=true],
        textarea[aria-invalid=true] {
            border-color: var(--er)
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 4px
        }

        .f2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        @media(max-width:640px) {
            .f2 {
                grid-template-columns: 1fr
            }
        }

        .fd {
            margin-bottom: 14px
        }

        .fd input[type=checkbox] {
            width: auto;
            margin-right: 8px
        }

        .er {
            color: var(--er);
            font-size: .9rem;
            min-height: 1.3em
        }

        #st {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 14px
        }

        #st.ok {
            background: #e3f4e8;
            color: #14532d
        }

        #st.err {
            background: #fdeceb;
            color: #8a1c14
        }

        #st:empty {
            display: none
        }

        .map {
            min-height: 240px;
            border: 2px dashed var(--line);
            border-radius: var(--r);
            display: grid;
            place-items: center;
            text-align: center;
            padding: 20px;
            color: var(--steel)
        }

        .map iframe {
            width: 100%;
            height: 300px;
            border: 0
        }

        .cta {
            background: var(--ink);
            color: #fff;
            text-align: center
        }

        .cta h2 {
            color: #fff
        }

        .cta p {
            color: #c9d6e2;
            max-width: 520px;
            margin: 0 auto 20px
        }

        dialog {
            border: 0;
            border-radius: var(--r);
            padding: 28px;
            max-width: 560px;
            width: calc(100% - 32px);
            background: var(--card);
            color: var(--tx);
            box-shadow: var(--sh)
        }

        dialog::backdrop {
            background: rgba(8, 20, 32, .6)
        }

        dialog .x {
            position: absolute;
            right: 12px;
            top: 8px;
            background: 0;
            border: 0;
            font-size: 2rem;
            color: var(--tx);
            cursor: pointer
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0
        }

        td {
            padding: 8px 0;
            border-bottom: 1px solid var(--line)
        }

        td:first-child {
            color: var(--steel);
            width: 40%
        }

        footer {
            background: var(--ink);
            color: #c9d6e2;
            padding: 56px 0 28px
        }

        footer h3 {
            color: #fff;
            font-size: 1.2rem
        }

        footer a {
            display: block;
            text-decoration: none;
            padding: 3px 0
        }

        footer a:hover {
            color: var(--amber)
        }

        .fg {
            display: grid;
            gap: 32px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))
        }

        .cp {
            border-top: 1px solid rgba(255, 255, 255, .15);
            margin-top: 36px;
            padding-top: 18px;
            font-size: .9rem
        }

        .tk {
            background: #0a1a2a;
            border-top: 1px solid rgba(255, 255, 255, .1);
            font-size: .88rem;
            overflow: hidden;
            white-space: nowrap
        }

        .tkm {
            display: inline-flex;
            animation: tk 70s linear infinite
        }

        .tk:hover .tkm {
            animation-play-state: paused
        }

        @keyframes tk {
            to {
                transform: translateX(-50%)
            }
        }

        .tg {
            display: inline-flex;
            gap: 32px;
            padding: 7px 32px 7px 0
        }

        .tg span {
            display: inline-flex;
            gap: 7px;
            align-items: baseline
        }

        .tg b {
            font-weight: 500;
            color: #c9d6e2
        }

        .tg em {
            font-style: normal;
            font-weight: 600;
            color: var(--amber)
        }

        .tg small {
            color: #8ea3b6
        }

        .px th {
            text-align: left;
            padding: 8px 14px 8px 0;
            border-bottom: 2px solid var(--line);
            color: var(--hd)
        }

        .px td {
            padding: 8px 14px 8px 0
        }

        .px td:first-child {
            width: auto;
            color: inherit
        }

        .px td:nth-child(2),
        .px th:nth-child(2) {
            text-align: right
        }

        :root {
            --up: #12783f;
            --dn: #c0291f
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --up: #3ddc84;
                --dn: #ff6b6b
            }
        }

        :root[data-theme=dark] {
            --up: #3ddc84;
            --dn: #ff6b6b
        }

        .px .up {
            color: var(--up)
        }

        .px .dn {
            color: var(--dn)
        }

        .px td {
            font-variant-numeric: tabular-nums
        }

        .px small {
            display: block;
            color: var(--steel);
            font-size: .85rem
        }

        .tg .up {
            color: #3ddc84
        }

        .tg .dn {
            color: #ff6b6b
        }

        .tg em.eq {
            color: #fff
        }

        .tg i {
            font-style: normal;
            font-size: .8rem
        }

        .tg i.eq {
            color: #8ea3b6
        }

        .tg span.fl,
        .px tr.fl {
            animation: fl 1.4s ease-out
        }

        @keyframes fl {
            from {
                background: rgba(240, 163, 10, .35)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .tk {
                overflow-x: auto
            }

            .tg+.tg {
                display: none
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }

            .rv {
                opacity: 1;
                transform: none
            }
        }

        .logo {
            gap: 12px
        }

        .lp {
            display: block;
            flex: none;
            padding: 5px 10px;
            background: #fff;
            border-radius: 8px
        }

        .lp img {
            height: 34px;
            width: auto;
            max-width: none;
            transition: height .3s
        }

        header.s .lp img {
            height: 28px
        }

        .ln {
            font: 700 1.45rem/1 "Barlow Condensed", "Arial Narrow", sans-serif;
            letter-spacing: .01em;
            white-space: nowrap
        }

        @media(max-width:400px) {
            .ln {
                font-size: 1.2rem
            }
        }

        @media(max-width:340px) {
            .ln {
                display: none
            }
        }

        .footer-logo {
            display: inline-block;
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px
        }

        .footer-logo img {
            width: 150px;
            height: auto
        }

        .lc {
            display: grid;
            place-items: center;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 36px
        }

        .lc img {
            width: min(100%, 380px);
            height: auto
        }

        .loc {
            margin-bottom: 16px
        }

        .loc h3 {
            margin-bottom: .25em
        }

        .loc p {
            margin: 0 0 .8em
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        .pr p {
            max-width: 68ch;
            margin: 0 0 1.1em
        }

        .lgrid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            margin: 20px 0 40px
        }

        .lk {
            border-top: 4px solid var(--line)
        }

        .lk.up {
            border-top-color: var(--up)
        }

        .lk.dn {
            border-top-color: var(--dn)
        }

        .lk:hover {
            transform: none;
            box-shadow: none
        }

        .ltop h3 {
            font-size: 1.3rem;
            margin: 0
        }

        .lbadge {
            display: block;
            font-size: .85rem;
            color: var(--steel);
            line-height: 1.3;
            margin-top: 5px
        }

        .lval {
            font: 700 2.4rem/1.05 "Barlow Condensed", "Arial Narrow", sans-serif;
            color: var(--hd);
            margin: 16px 0 6px;
            font-variant-numeric: tabular-nums
        }

        .lval small {
            display: block;
            font: 400 .9rem/1.3 Barlow, system-ui, sans-serif;
            color: var(--steel);
            margin-top: 2px
        }

        .lchg {
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        .lchg.up {
            color: var(--up)
        }

        .lchg.dn {
            color: var(--dn)
        }

        .lchg.eq {
            color: var(--steel)
        }

        .lwhen {
            color: var(--steel);
            font-size: .88rem;
            margin-top: 8px
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--up);
            margin-right: 6px;
            animation: pl 2s ease-in-out infinite
        }

        @keyframes pl {
            50% {
                opacity: .3
            }
        }

        .lk.fl {
            animation: fl 1.4s ease-out
        }

        @media(prefers-reduced-motion:reduce) {
            .dot {
                animation: none
            }
        }

        @media(max-width:760px) {
            .px thead {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0)
            }

            .px,
            .px tbody {
                display: block
            }

            .px tr {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 4rem 9.4rem;
                column-gap: 10px;
                row-gap: 3px;
                align-items: baseline;
                padding: 12px 0;
                border-bottom: 1px solid var(--line)
            }

            .px td {
                padding: 0;
                border: 0
            }

            .px td:nth-child(1) {
                font-weight: 600
            }

            .px td:nth-child(3) {
                text-align: right;
                white-space: nowrap;
                font-size: .93rem
            }

            .px td:nth-child(4),
            .px td:nth-child(5),
            .px td:nth-child(6) {
                font-size: .88rem;
                color: var(--steel)
            }

            .px td:nth-child(4) {
                grid-column: 1;
                grid-row: 2
            }

            .px td:nth-child(5) {
                grid-column: 2/-1;
                grid-row: 2;
                text-align: right
            }

            .px td:nth-child(6) {
                grid-column: 1/-1;
                grid-row: 3
            }

            .px td:nth-child(6) small {
                display: inline;
                margin-left: 6px
            }
        }

        /* Godown slideshow: same tile position and proportions on every page. */
        .godown-slideshow {
            aspect-ratio: 8/5;
            background: var(--ink)
        }

        .godown-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform .55s ease
        }

        .tile .godown-track img {
            flex: 0 0 100%;
            min-width: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
            transition: none
        }

        @media(prefers-reduced-motion:reduce) {
            .godown-track {
                transition: none
            }
        }

        .featured-yarn .godown-slideshow {
            border-radius: var(--r) var(--r) 0 0
        }

        .yarn-image-note {
            font-size: .82rem;
            color: var(--steel)
        }
    </style>
</head>

        const blogs = () => head("Blog", "blogs", "Yarn market guides, news and insights from our team.") + sec(`<div class="bar">${chips(["All", ...new Set(BL.map(b => b.c))])}</div><div id="bl" class="g"></div><p style="text-align:center;margin-top:28px"><button class="btn l" id="more">Load more</button></p>`);
